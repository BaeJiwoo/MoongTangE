syntax = "proto3";
package MoongTangE.proto;

// Presence is explicit for values whose omission must not silently become zero.
message Vector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Quaternion {
  optional double w = 1;
  optional double x = 2;
  optional double y = 3;
  optional double z = 4;
}

message ClientHello {
  uint32 protocol_version = 1;
  string admission_ticket = 2;
  string nickname = 3;
}

message ServerHello {
  uint32 protocol_version = 1;
  uint32 player_id = 2;
  uint64 room_id = 3;
  // 0 is unspecified/pending and is never a terminal wire response.
  enum AdmissionStatus {
    UNSPECIFIED = 0;
    ACCEPTED = 1;
    FULL = 2;
    UNAVAILABLE = 3;
    INVALID_NICKNAME = 4;
  }
  AdmissionStatus status = 4;
}

message InputCommand {
  uint64 sequence = 1;
  optional double x = 2;
  optional double z = 3;
  // Player identity comes from the server-assigned session, never this message.
  uint64 restart_death_tick = 4;
  uint64 next_round_id = 5;
}

message PlayerState {
  uint32 id = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  Quaternion orientation = 4;
  Vector3 angular_velocity = 5;
  string nickname = 6;
  // Explicit zero means alive; nonzero identifies the defeat being acknowledged.
  optional uint64 death_tick = 7;
  optional uint32 round_score = 8;
  optional bool round_winner = 9;
  optional double radius = 10;
  optional uint32 food_eaten = 11;
  optional uint64 mine_hit_tick = 12;
}

message RoundState {
  uint64 id = 1;
  enum Phase {
    FREE_PLAY = 0;
    COUNTDOWN = 1;
    PLAYING = 2;
    RESULTS = 3;
  }
  Phase phase = 2;
  uint64 remaining_ticks = 3;
  bool competitive = 4;
}

enum CollectibleKind {
  COLLECTIBLE_UNSPECIFIED = 0;
  APPLE = 1;
  BANANA = 2;
  BURGER = 3;
  DONUT = 4;
}

message CollectibleState {
  uint32 id = 1;
  CollectibleKind kind = 2;
  Vector3 position = 3;
  Quaternion orientation = 4;
  optional double scale = 5;
  uint32 attached_player_id = 6;
}

message MineState {
  uint32 id = 1;
  Vector3 position = 2;
  uint64 ready_tick = 3;
}

message WorldSnapshot {
  optional uint64 server_tick = 1;
  repeated PlayerState players = 2;
  uint64 room_id = 3;
  repeated CollectibleState collectibles = 4;
  RoundState round = 5;
  repeated MineState mines = 6;
}

message Disconnect {}
