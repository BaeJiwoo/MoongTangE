syntax = "proto3";
package MoongTangE.proto;

// Presence is explicit for values whose omission must not silently become zero.
message Vector3 {
  optional double x = 1;
  optional double y = 2;
  optional double z = 3;
}

message Quaternion {
  optional double w = 1;
  optional double x = 2;
  optional double y = 3;
  optional double z = 4;
}

message ClientHello {
  uint32 protocol_version = 1;
  string admission_ticket = 2;
  string nickname = 3;
}

message ServerHello {
  uint32 protocol_version = 1;
  uint32 player_id = 2;
  uint64 room_id = 3;
  // 0 is unspecified/pending and is never a terminal wire response.
  enum AdmissionStatus {
    UNSPECIFIED = 0;
    ACCEPTED = 1;
    FULL = 2;
    UNAVAILABLE = 3;
    INVALID_NICKNAME = 4;
  }
  AdmissionStatus status = 4;
}

message InputCommand {
  uint64 sequence = 1;
  optional double x = 2;
  optional double z = 3;
  // Player identity comes from the server-assigned session, never this message.
}

message PlayerState {
  uint32 id = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  Quaternion orientation = 4;
  Vector3 angular_velocity = 5;
  string nickname = 6;
}

message WorldSnapshot {
  optional uint64 server_tick = 1;
  repeated PlayerState players = 2;
  uint64 room_id = 3;
}

message Disconnect {}
