name: Build and test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure without graphics and networking dependencies
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DSANDBOX_BUILD_CLIENT=OFF -DSANDBOX_BUILD_NETWORK=OFF
      - name: Build core
        run: cmake --build build-core --config Release --parallel 2
      - name: Test core
        run: ctest --test-dir build-core -C Release --output-on-failure
